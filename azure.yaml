# Azure Developer CLI project: provisions the shared Microsoft-track baseline and deploys RequestHub.
# Images are built in Azure Container Registry (remoteBuild), so Docker is not required locally.
name: ai-sdlc-requesthub
metadata:
  template: ai-sdlc-requesthub@1.0.0
infra:
  provider: bicep
  path: infra
services:
  api:
    project: ./app
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
  worker:
    project: ./app
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile.worker
      context: .
      remoteBuild: true
