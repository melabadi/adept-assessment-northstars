# Release · Microsoft: ship RequestHub's API to Azure Container Apps through a candidate revision.
#   build      builds the image once per commit and pushes it to the solution's registry (reused if it already exists)
#   candidate  adds a revision with 0% of traffic, waits until it is ready, smoke-tests it on its own URL, and bakes it
#   promote    moves 100% of traffic to the candidate, only after the gate passed, then verifies production
#   abort      removes a candidate that failed the gate; users never reached it
#   record     combines every step into one release record (run summary and artifact)
# Run it from the Actions tab or `gh workflow run release-microsoft-rollout.yml`. Pick fault=fail-readiness to rehearse a
# bad release. A pull request that changes the release tooling rehearses a release: the same steps, never promoted.
name: Release · Microsoft · roll out a candidate revision

on:
  workflow_dispatch:
    inputs:
      fault:
        description: Fault to inject into the candidate (fail-readiness rehearses a bad release)
        type: choice
        options: [none, fail-readiness]
        default: none
      bake:
        description: Seconds to keep calling the candidate after its smoke test
        type: number
        default: 60
  pull_request:
    paths:
      - 'solutions/06-release-microsoft/release.py'
      - 'solutions/06-release-microsoft/azd_env.py'
      - '.github/workflows/release-microsoft-rollout.yml'

permissions:
  contents: read
  id-token: write
  pull-requests: write

# Releases and rollbacks of this app never overlap.
concurrency:
  group: release-microsoft
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SOLUTION: solutions/06-release-microsoft

jobs:
  build:
    name: Build the image once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-microsoft
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push the image, or reuse the one already built for this commit
        id: image
        env:
          REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        run: |
          name="${REGISTRY%%.*}"
          tagged="$REGISTRY/requesthub-api:$GITHUB_SHA"
          if digest=$(az acr repository show --name "$name" --image "requesthub-api:$GITHUB_SHA" --query digest -o tsv 2>/dev/null) && [ -n "$digest" ]; then
            reused=true
          else
            az acr login --name "$name"
            docker build app --file app/Dockerfile --tag "$tagged" \
              --build-arg BUILD_SHA="$GITHUB_SHA" \
              --label org.opencontainers.image.revision="$GITHUB_SHA" \
              --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            docker push "$tagged"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$tagged" | cut -d@ -f2)
            reused=false
          fi
          image="$REGISTRY/requesthub-api@$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          mkdir -p "$SOLUTION/out/release"
          jq -n --arg commit "$GITHUB_SHA" --arg image "$image" --argjson reused "$reused" \
            '{commit: $commit, image: $image, reused: $reused}' > "$SOLUTION/out/release/build.json"
          { echo "### Image"; echo; echo "\`$image\` from commit \`$GITHUB_SHA\` ($([ "$reused" = true ] && echo 'reused: already built for this commit' || echo 'built in this run'))"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-build
          path: ${{ env.SOLUTION }}/out/release/

  candidate:
    name: Deploy the candidate and gate it
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-microsoft
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      API_APP_NAME: ${{ vars.API_APP_NAME }}
      API_IDENTIFIER_URI: ${{ vars.API_IDENTIFIER_URI }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the candidate revision (0% of traffic)
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          FAULT: ${{ inputs.fault || 'none' }}
        run: python "$SOLUTION/release.py" deploy --image "$IMAGE" --commit "$GITHUB_SHA" --fault "$FAULT"
      - name: Gate (readiness, smoke test, and bake on the candidate's own URL)
        env:
          BAKE: ${{ inputs.bake || 20 }}
        run: python "$SOLUTION/release.py" gate --bake "$BAKE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-candidate
          path: ${{ env.SOLUTION }}/out/release/

  promote:
    name: Promote to 100% of traffic
    needs: candidate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release-microsoft
      url: ${{ vars.API_URL }}
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      API_APP_NAME: ${{ vars.API_APP_NAME }}
      API_IDENTIFIER_URI: ${{ vars.API_IDENTIFIER_URI }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Promote (one atomic traffic change; the old stable revision stays warm as previous)
        run: python "$SOLUTION/release.py" promote
      - name: Verify production
        run: python "$SOLUTION/release.py" verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-promote
          path: ${{ env.SOLUTION }}/out/release/

  abort:
    name: Remove the candidate (users stay on stable)
    needs: candidate
    # A candidate that failed or was cancelled is removed. A pull request rehearsal always cleans up after itself.
    if: >-
      always() && (needs.candidate.result == 'failure' || needs.candidate.result == 'cancelled'
      || (github.event_name == 'pull_request' && needs.candidate.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-microsoft
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      API_APP_NAME: ${{ vars.API_APP_NAME }}
      API_IDENTIFIER_URI: ${{ vars.API_IDENTIFIER_URI }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Remove the candidate and verify production
        run: python "$SOLUTION/release.py" abort
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-abort
          path: ${{ env.SOLUTION }}/out/release/

  record:
    name: Release record
    needs: [build, candidate, promote, abort]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ env.SOLUTION }}/out/release/
      - name: Combine the steps into one release record
        run: python "$SOLUTION/release.py" record
      - name: Comment the rehearsal on the pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('solutions/06-release-microsoft/out/release/release-record.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          { echo "Release rehearsal in [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Production traffic was not moved."; echo; cat "$SOLUTION/out/release/release-record.md"; } > comment.md
          gh pr comment "$PR" --body-file comment.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-record
          path: ${{ env.SOLUTION }}/out/release/
