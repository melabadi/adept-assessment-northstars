# Azure Developer CLI project for the Release · Microsoft solution. Run `azd up` from this folder.
# It provisions infra/: RequestHub's hosting platform from app/infra, plus the release's orchestration in Azure (an Event
# Grid trigger on the registry, a Logic App that starts the release job, and the release-records workbook). Then it
# deploys three services, each built in Azure Container Registry: the shared app's api and worker (app/infra/api.bicep
# and worker.bicep) and the release jobs (this folder's Dockerfile and infra/jobs.bicep).
# After that first deployment, the API is released through the release jobs, which add candidate revisions without
# traffic instead of replacing the running one.
name: ai-sdlc-release-microsoft
metadata:
  template: ai-sdlc-release-microsoft@2.0.0
infra:
  provider: bicep
  path: infra
services:
  api:
    project: ../../app
    language: docker
    host: containerapp
    module: ../../../app/infra/api
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
  worker:
    project: ../../app
    language: docker
    host: containerapp
    module: ../../../app/infra/worker
    docker:
      path: ./Dockerfile.worker
      context: .
      remoteBuild: true
  release:
    project: .
    language: docker
    host: containerapp
    module: jobs
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
