# Azure Developer CLI project for the Release · Microsoft solution. Run `azd up` from this folder.
# It provisions infra/: RequestHub's hosting platform from app/infra, plus the release's orchestration in Azure (Event
# Grid on the registry, the release trigger's function app, and the release-records workbook). Then it deploys four
# services: the shared app's api and worker (app/infra/api.bicep and worker.bicep) and the release jobs (this folder's
# Dockerfile and infra/jobs.bicep), each built in Azure Container Registry, and the release trigger (trigger/, a Python
# Azure Function). The hooks are the project's, so each runs once per deploy:
#   predeploy    run the offline tests: a trigger or release step that breaks a safety rule never reaches Azure
#   postdeploy   once every service is deployed, connect Event Grid to the function (infra/release-on-push.bicep).
#                Event Grid accepts only a function that exists, and a push must find the release job and the
#                function's right to start it, so azd deploys services first, in parallel, and connects them last.
# After that first deployment, the API is released through the release jobs, which add candidate revisions without
# traffic instead of replacing the running one.
name: ai-sdlc-release-microsoft
metadata:
  template: ai-sdlc-release-microsoft@2.1.0
infra:
  provider: bicep
  path: infra
services:
  api:
    project: ../../app
    language: docker
    host: containerapp
    module: ../../../app/infra/api
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
  worker:
    project: ../../app
    language: docker
    host: containerapp
    module: ../../../app/infra/worker
    docker:
      path: ./Dockerfile.worker
      context: .
      remoteBuild: true
  release:
    project: .
    language: docker
    host: containerapp
    module: jobs
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
  trigger:
    project: trigger
    language: python
    host: function
hooks:
  predeploy:
    windows:
      shell: pwsh
      run: python -m unittest -q
    posix:
      shell: sh
      run: python3 -m unittest -q
  postdeploy:
    windows:
      shell: pwsh
      run: |
        $missing = 'AZURE_SUBSCRIPTION_ID', 'AZURE_RESOURCE_GROUP', 'RELEASE_TRIGGER_NAME', 'RELEASE_TOPIC_NAME', 'RELEASE_REPOSITORY' |
          Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
        if ($missing) { Write-Host "Event Grid is not connected: $($missing -join ', ') not set. Run azd provision first."; exit 1 }
        # A function just deployed can take a minute to be listed, and Event Grid accepts it only once it is. Exit code 3
        # means not found (yet); any other failure is reported at once.
        foreach ($try in 1..12) {
          $output = az functionapp function show --resource-group $env:AZURE_RESOURCE_GROUP --name $env:RELEASE_TRIGGER_NAME `
            --function-name release_on_push --only-show-errors --output none 2>&1
          if ($LASTEXITCODE -ne 3) { break }
          if ($try -lt 12) { Start-Sleep -Seconds 10 }
        }
        if ($LASTEXITCODE) {
          $output | ForEach-Object { Write-Host $_ }
          Write-Host 'Event Grid is not connected to the function release_on_push. If it is not deployed, run azd deploy trigger.'
          exit 1
        }
        az deployment group create --subscription $env:AZURE_SUBSCRIPTION_ID --resource-group $env:AZURE_RESOURCE_GROUP `
          --name release-on-push --template-file infra/release-on-push.bicep --only-show-errors --output none `
          --parameters topicName=$env:RELEASE_TOPIC_NAME triggerName=$env:RELEASE_TRIGGER_NAME repository=$env:RELEASE_REPOSITORY
        exit $LASTEXITCODE
    posix:
      shell: sh
      run: |
        : "${AZURE_SUBSCRIPTION_ID:?run azd provision first}" "${AZURE_RESOURCE_GROUP:?run azd provision first}" \
          "${RELEASE_TRIGGER_NAME:?run azd provision first}" "${RELEASE_TOPIC_NAME:?run azd provision first}" \
          "${RELEASE_REPOSITORY:?run azd provision first}"
        # A function just deployed can take a minute to be listed, and Event Grid accepts it only once it is. Exit code 3
        # means not found (yet); any other failure is reported at once.
        tries=1
        while :; do
          if output=$(az functionapp function show --resource-group "$AZURE_RESOURCE_GROUP" --name "$RELEASE_TRIGGER_NAME" \
              --function-name release_on_push --only-show-errors --output none 2>&1); then status=0; else status=$?; fi
          if [ "$status" -ne 3 ] || [ "$tries" -ge 12 ]; then break; fi
          tries=$((tries + 1)); sleep 10
        done
        if [ "$status" -ne 0 ]; then
          echo "$output"
          echo 'Event Grid is not connected to the function release_on_push. If it is not deployed, run azd deploy trigger.'
          exit 1
        fi
        az deployment group create --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" \
          --name release-on-push --template-file infra/release-on-push.bicep --only-show-errors --output none \
          --parameters topicName="$RELEASE_TOPIC_NAME" triggerName="$RELEASE_TRIGGER_NAME" repository="$RELEASE_REPOSITORY"
