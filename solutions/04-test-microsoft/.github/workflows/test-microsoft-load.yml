# Test · Microsoft: run the authenticated RequestHub load test in Azure Load Testing and tell the team how it went.
#  - Pull request that changes the load test: runs it against the deployed RequestHub and comments the report.
#  - Push to main that changes the load test, or a manual run: runs it, and opens or updates one Issue (label load-test)
#    when the journey misses its criteria, or closes that Issue when a run passes again.
#  - Manual run with "slowdown": rehearses a regression. The workflow slows the request list on the deployed API (the
#    fault expires on its own after 30 minutes), runs the test, which is expected to fail, then removes the slowdown.
# The job signs in to Azure with OIDC (GitHub environment test-microsoft); the load test signs in to RequestHub with two
# managed identities. No password, key, or token is stored anywhere.
name: Test · Microsoft · load test RequestHub

on:
  pull_request:
    paths:
      - 'solutions/04-test-microsoft/loadtest/**'
      - 'solutions/04-test-microsoft/load_test.py'
      - '.github/workflows/test-microsoft-load.yml'
  push:
    branches: [main]
    paths:
      - 'solutions/04-test-microsoft/loadtest/**'
      - 'solutions/04-test-microsoft/load_test.py'
      - '.github/workflows/test-microsoft-load.yml'
  workflow_dispatch:
    inputs:
      slowdown:
        description: 'Rehearse a regression: slow the request list by 1500 ms during the run (expected to fail), then remove it'
        type: boolean
        default: false
      users:
        description: 'Concurrent virtual users (empty keeps the configured 10)'
        default: ''
      duration:
        description: 'Seconds of load (empty keeps the configured 120)'
        default: ''

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

# Every run targets the same deployment, so runs wait for each other.
concurrency:
  group: test-microsoft-load
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  load-test:
    name: Load test the deployed RequestHub
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: test-microsoft
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      LOAD_TEST_NAME: ${{ vars.LOAD_TEST_NAME }}
      LOAD_TEST_REQUESTER_IDENTITY: ${{ vars.LOAD_TEST_REQUESTER_IDENTITY }}
      LOAD_TEST_APPROVER_IDENTITY: ${{ vars.LOAD_TEST_APPROVER_IDENTITY }}
      API_URL: ${{ vars.API_URL }}
      API_IDENTIFIER_URI: ${{ vars.API_IDENTIFIER_URI }}
      API_APP_NAME: ${{ vars.API_APP_NAME }}
      APPLICATIONINSIGHTS_NAME: ${{ vars.APPLICATIONINSIGHTS_NAME }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r solutions/04-test-microsoft/requirements.txt
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Azure CLI extensions for the report
        run: |
          az extension add --name load --upgrade --only-show-errors
          az extension add --name application-insights --upgrade --only-show-errors
      - name: Check the load scenario (criteria, guardrails, Python 3.9, no secrets)
        run: python .github/skills/load-scenario/check_scenario.py
      - name: Inject the rehearsal slowdown (expires on its own after 30 minutes)
        if: inputs.slowdown
        run: python solutions/04-test-microsoft/slowdown.py on --delay-ms 1500 --minutes 30
      - name: Write the test configuration for this deployment
        env:
          USERS: ${{ inputs.users }}
          DURATION: ${{ inputs.duration }}
        run: |
          args=()
          if [ -n "$USERS" ]; then args+=(--users "$USERS"); fi
          if [ -n "$DURATION" ]; then args+=(--duration "$DURATION"); fi
          python solutions/04-test-microsoft/load_test.py config "${args[@]}"
      - name: Run the load test in Azure Load Testing
        id: loadtest
        uses: azure/load-testing@575d8931b92662596940eb75c9eca346dd785813 # v1.2.7
        with:
          loadtestConfigFile: solutions/04-test-microsoft/out/loadtest.yaml
          loadtestResource: ${{ vars.LOAD_TEST_NAME }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          # The action limits run names to 50 characters and descriptions to 100.
          loadtestRunName: GitHub run ${{ github.run_number }} (${{ github.event_name }}${{ inputs.slowdown && ', slowdown' || '' }})
          loadtestRunDescription: Workflow run ${{ github.run_id }} at ${{ github.sha }}
          outputVariableName: loadtest
      # The OIDC sign-in above expires after a few minutes, so sign in again for the steps after the test.
      - name: Sign in to Azure again
        if: always()
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Report the result (job summary, pull request comment, Issue)
        if: always() && steps.loadtest.outputs['loadtest.testRunId'] != ''
        env:
          RUN_ID: ${{ steps.loadtest.outputs['loadtest.testRunId'] }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          args=(--run-id "$RUN_ID")
          # Issues track the deployed journey; pull requests get a comment instead.
          if [ "$EVENT" != "pull_request" ]; then args+=(--issue); fi
          status=0
          python solutions/04-test-microsoft/load_test.py report "${args[@]}" || status=$?
          if [ -n "$PR" ] && [ -f solutions/04-test-microsoft/out/report.md ]; then
            gh pr comment "$PR" --body-file solutions/04-test-microsoft/out/report.md
          fi
          exit $status
      - name: Remove the rehearsal slowdown
        if: always() && inputs.slowdown
        run: python solutions/04-test-microsoft/slowdown.py off
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-test-report
          path: solutions/04-test-microsoft/out/report.md
          if-no-files-found: ignore
          retention-days: 14
