# Plan · Microsoft: run the Microsoft Foundry requirements analyst from GitHub Actions (OIDC, no stored credentials) and push
# its brief to a branch. The run summary links to a prefilled pull request: a person opens it, the review workflow
# (plan-microsoft-brief.yml) validates the brief, and applying `brief-approved` publishes the backlog.
# The workflow does not open the pull request itself, so it needs no permission to create pull requests, and a pull
# request opened by a person starts the validation check right away.
# The Foundry endpoint names a deployed resource, so it is an environment secret: GitHub masks secrets in the log, while
# variables appear in clear text in every step's environment listing.
name: Plan · Microsoft · run the Foundry requirements analyst

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: plan-microsoft-analyst
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Run the agent and push the brief
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: plan-microsoft
    steps:
      - name: Mask the parts of the Foundry endpoint
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
        run: |
          # GitHub masks the endpoint secret only as a whole; an error message could print its host or account name.
          host="${FOUNDRY_PROJECT_ENDPOINT#https://}"
          host="${host%%/*}"
          if [ -n "$host" ]; then
            echo "::add-mask::$host"
            echo "::add-mask::${host%%.*}"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r solutions/01-plan-microsoft/requirements.txt
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run the Foundry agent (live call, validated, one repair turn)
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL_DEPLOYMENT: ${{ vars.FOUNDRY_MODEL_DEPLOYMENT }}
        run: python solutions/01-plan-microsoft/requirements_analyst.py | tee analyst.txt
      - name: Push the brief and link to a prefilled pull request
        env:
          RUN_ID: ${{ github.run_id }}
          BASE: ${{ github.ref_name }}
          BRIEF: solutions/01-plan-microsoft/brief
        run: |
          branch="plan/foundry-brief-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$BRIEF"
          git commit -m "Plan: Foundry requirements brief (run $RUN_ID)"
          git push origin "$branch"
          agent=$(jq -r '"\(.agent.name) v\(.agent.version)"' "$BRIEF/run.json")
          response=$(jq -r .responseId "$BRIEF/run.json")
          validation=$(python .github/skills/requirements-traceability/validate_backlog.py --backlog "$BRIEF/backlog.json" || true)
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          body=$(printf '%s\n\n%s\n\n%s' \
            "Produced by the Microsoft Foundry agent **$agent** (response \`$response\`) from \`solutions/01-plan-microsoft/inputs\`, in [workflow run $RUN_ID]($run_url)." \
            "Validation: \`$validation\`" \
            "Review \`$BRIEF/brief.md\`. When it is right, apply the **brief-approved** label to publish the epic and tasks as Issues.")
          query=$(jq -rn --arg title "Plan: Foundry requirements brief" --arg body "$body" '"title=\($title|@uri)&body=\($body|@uri)"')
          link="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE...$branch?quick_pull=1&$query"
          {
            echo "### Foundry requirements brief"
            echo
            echo "Agent **$agent**, response \`$response\`."
            echo
            echo '```'
            cat analyst.txt
            echo '```'
            echo
            echo "**[Open the review pull request]($link)** (branch \`$branch\`)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Open the review pull request: $link"
