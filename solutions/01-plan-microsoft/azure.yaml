# Azure Developer CLI project for the Plan · Microsoft solution. Run `azd up` from this folder.
# The hooks set the GitHub repository and publish the agent, its evaluators, and the evaluation to Foundry.
name: ai-sdlc-plan-microsoft
metadata:
  template: ai-sdlc-plan-microsoft@2.0.0
infra:
  provider: bicep
  path: infra
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: python setup_foundry.py prepare
    posix:
      shell: sh
      run: python3 setup_foundry.py prepare
  postprovision:
    windows:
      shell: pwsh
      run: python setup_foundry.py publish
    posix:
      shell: sh
      run: python3 setup_foundry.py publish
