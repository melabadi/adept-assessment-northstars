# Azure Developer CLI project for the Plan · Microsoft solution. Run `azd up` from this folder, in a shell where
# `pip install -r requirements.txt` ran: the hooks use those packages.
#   prepackage (function)  copy agent.yaml and inputs/ into the Function app's package (function/bundle/)
#   preprovision           set the GitHub repository; move a GITHUB_TOKEN stored in the azd environment to PLAN_GITHUB_TOKEN
#   postprovision          run the unit tests, then publish the agent, its evaluators, and the evaluation to Foundry
#   predeploy              run the unit tests again: a broken step or grader never reaches Azure
# preprovision and postprovision are interactive so their output stays on screen: the README's "What you should see"
# quotes it. azd shows a hook that isn't interactive in an 8-line pane that it clears once the hook succeeds.
name: ai-sdlc-plan-microsoft
metadata:
  template: ai-sdlc-plan-microsoft@3.0.0
infra:
  provider: bicep
  path: infra
services:
  function:
    project: function
    language: python
    host: function
    hooks:
      prepackage:
        windows:
          shell: pwsh
          run: python ../setup_foundry.py bundle
        posix:
          shell: sh
          run: python3 ../setup_foundry.py bundle
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: python setup_foundry.py prepare
      interactive: true
    posix:
      shell: sh
      run: python3 setup_foundry.py prepare
      interactive: true
  postprovision:
    windows:
      shell: pwsh
      run: python setup_foundry.py publish
      interactive: true
    posix:
      shell: sh
      run: python3 setup_foundry.py publish
      interactive: true
  predeploy:
    windows:
      shell: pwsh
      run: python -m unittest discover -s tests -q
    posix:
      shell: sh
      run: python3 -m unittest discover -s tests -q
