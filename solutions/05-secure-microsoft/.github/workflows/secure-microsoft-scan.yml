# Secure · Microsoft: find cloud posture findings in the solution's resource group and track them as GitHub Issues.
# Reads the storage account's live configuration, Azure Policy compliance, and Defender for Cloud recommendations, each as
# its own source, and checks what the finding means for users (an attachment upload and download through the API).
# Signs in through OIDC as an identity that can read and start a Policy evaluation, but cannot change anything.
# A misconfiguration that Policy or Defender reported becomes one Issue (deduplicated) for a person or Copilot.
name: Secure · Microsoft · scan cloud posture

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Start an Azure Policy evaluation first (adds a few minutes)
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: secure-microsoft-posture
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  scan:
    name: Scan posture and track findings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: secure-microsoft
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      POLICY_ASSIGNMENT_NAME: ${{ vars.POLICY_ASSIGNMENT_NAME }}
      # Secrets, so GitHub masks them in logs: they name the deployed API.
      API_URL: ${{ secrets.API_URL }}
      API_IDENTIFIER_URI: ${{ secrets.API_IDENTIFIER_URI }}
    steps:
      - name: Mask the API host name
        run: echo "::add-mask::${API_URL#https://}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Scan and open or update the Issue
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          args=(scan --issue)
          if [ "$REFRESH" = "true" ]; then args+=(--refresh); fi
          python solutions/05-secure-microsoft/posture.py "${args[@]}"
      - name: Summary
        if: always()
        run: cat solutions/05-secure-microsoft/out/scan.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload the scan results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: posture-scan
          path: solutions/05-secure-microsoft/out/scan.*
          retention-days: 14
