# Azure Developer CLI project for the Secure · Microsoft solution. Run `azd up` from this folder.
# It provisions infra/ (RequestHub's hosting platform from app/infra plus a scoped Azure Policy assignment) and deploys the
# shared app: the api and worker images are built in Azure Container Registry, and each `azd deploy` applies
# app/infra/api.bicep or worker.bicep so image and configuration ship together. The hooks connect the solution to GitHub Actions.
name: ai-sdlc-secure-microsoft
metadata:
  template: ai-sdlc-secure-microsoft@1.0.0
infra:
  provider: bicep
  path: infra
services:
  api:
    project: ../../app
    language: docker
    host: containerapp
    module: ../../../app/infra/api
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
  worker:
    project: ../../app
    language: docker
    host: containerapp
    module: ../../../app/infra/worker
    docker:
      path: ./Dockerfile.worker
      context: .
      remoteBuild: true
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: python configure_github.py prepare
    posix:
      shell: sh
      run: python3 configure_github.py prepare
  postprovision:
    windows:
      shell: pwsh
      run: python configure_github.py publish
    posix:
      shell: sh
      run: python3 configure_github.py publish
