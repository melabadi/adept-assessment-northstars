# Azure Developer CLI project for the Develop · Microsoft solution: the Azure pull request reviewer.
# `azd up` from this folder provisions infra/ (Microsoft Foundry, two Azure Container Apps session pools, and the Logic
# App that runs each review), then publishes the reviewer agent to Foundry. There is no app to deploy: the reviewer
# reviews RequestHub's pull requests on GitHub.
name: ai-sdlc-develop-microsoft
metadata:
  template: ai-sdlc-develop-microsoft@2.0.0
infra:
  provider: bicep
  path: infra
hooks:
  postprovision:
    windows:
      shell: pwsh
      run: python publish_reviewer_agent.py
    posix:
      shell: sh
      run: python3 publish_reviewer_agent.py
