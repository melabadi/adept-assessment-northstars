# Design · GitHub: checks the agentic design review on every pull request that changes it.
#  - Unit tests for its trust boundaries: /design-review runs only for people with write access, on an Issue from the
#    owner, a member, or a collaborator, or on a pull request from a branch of this repository (the gate's own script
#    runs against a fake `gh`); the agent can only read and writes one comment and two allow-listed labels; a run that
#    threat detection flags applies nothing; and the contract verdict comes from the default branch's contract_diff.py
#    (the step's own script runs against a fake `gh` and the real tool).
#  - The lock file is exactly what the pinned gh-aw compiler produces from its source, so the workflow that runs is the
#    workflow that was reviewed.
name: Design · GitHub · check the agentic design review

on:
  pull_request:
    paths:
      - 'solutions/02-design-github/tests/**'
      - 'solutions/02-design-github/README.md'
      - 'solutions/02-design-github/.github/workflows/design-github-agentic-review.*'
      - 'solutions/02-design-github/.github/workflows/design-github-checks.yml'
      - '.github/workflows/design-github-agentic-review.*'
      - '.github/workflows/design-github-checks.yml'
      - '.github/skills/contract-impact/**'
      # The lock file records every custom agent's frontmatter, so a change to any agent makes it stale.
      - '.github/agents/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_AW_VERSION: v1.2.2 # pinned compiler; recompile and commit the lock file when you change it

jobs:
  tests:
    name: Agentic design review unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s solutions/02-design-github/tests -v

  agentic-workflow:
    name: Agentic design review lock file is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-aw ${{ env.GH_AW_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin "$GH_AW_VERSION"
      - name: Compile in strict mode and compare with the committed lock file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh aw compile design-github-agentic-review --strict --validate --no-check-update
          git diff --exit-code -- .github/workflows/design-github-agentic-review.lock.yml \
            || { echo "::error::Run 'gh aw compile design-github-agentic-review' with gh-aw $GH_AW_VERSION, then 'python tools/sync_solutions.py --pull .github/workflows/design-github-agentic-review.lock.yml', and commit."; exit 1; }
