# Azure SRE Agent configuration for the Operate · Microsoft solution. configure_sre_agent.py applies it through the
# agent's own API; azd runs it after every provision. Markdown files hold the long text. {{NAME}} placeholders are
# filled from the azd environment when applied.

# The custom agent that handles the incident. Its tools are the only ones it can call.
customAgent:
  name: notification-backlog-responder
  instructions: instructions.md
  handoffDescription: >-
    Investigates RequestHub notification backlog alerts from Azure Monitor: measures the backlog, finds what changed
    on the notification worker, proposes the smallest reversible mitigation, verifies recovery, and files the incident
    record as a GitHub Issue.
  tools:
    - RunAzCliReadCommands
    - RunAzCliWriteCommands        # only for the approved mitigation; the tool policy below makes every write ask first
    - QueryAppInsightsByAppId
    - QueryLogAnalyticsByWorkspaceId
    - SearchMemory                 # the runbook in knowledge/
    - PlotAreaChartWithCorrelation
    - PlotBarChart
  skills:
    - investigate-notification-backlog
    - verify-worker-recovery
    - file-incident-record
  # Quality gate: the agent cannot finish an investigation without the evidence a person needs to decide.
  stopHook: hooks/evidence-checklist.md

# Procedures the custom agent loads when relevant. Each file starts with name and description front matter.
skills:
  - file: skills/investigate-notification-backlog.md
    tools: [QueryAppInsightsByAppId, QueryLogAnalyticsByWorkspaceId, RunAzCliReadCommands]
  - file: skills/verify-worker-recovery.md
    tools: [QueryAppInsightsByAppId, RunAzCliReadCommands]
  - file: skills/file-incident-record.md
    tools: []
    githubIssueTools: true         # gets github.customAgentTools below

# GitHub. A person connects this repository once in the agent's portal (Build + setup, Code access) with a fine-grained
# token (README, "Connect GitHub"). The agent's GitHub tools are runtime tools: they exist only while the repository is
# connected, and the tool catalog API doesn't list them. Until then the custom agent has no GitHub tool and puts the
# incident record in its reply.
github:
  # The only GitHub tool the custom agent and the file-incident-record skill get, by exact name. It is added while
  # this repository is connected and its credential is healthy.
  customAgentTools: [CreateGithubIssue]
  # Tool name patterns (* is a wildcard) for every GitHub Issue tool, reads included (CreateGithubIssue,
  # FetchGithubIssue, FetchGithubIssuesLimited), matched without regard to case. They go into the tool policy's ask
  # list and the guard hook's matcher, so every Issue call waits for a person.
  issueTools: ["*Issue*"]
  # Everything else the token could allow stays off: pull requests, workflows, branches, commits and their statuses,
  # merges, pushes, and webhooks. The patterns (and the exact catalog names they match) go into the tool policy's deny
  # list, and the guard hook blocks them too.
  deny: ["*PullRequest*", "*pull_request*", "*Workflow*", "*Branch*", "*Commit*", "*Merge*", "*Push*", "*Webhook*"]
  # A global PreToolUse hook that runs before every call to the Issue tools, ahead of the tool policy. It is
  # deterministic (regular expressions): it blocks the call when the text contains an identifier of this deployment,
  # and otherwise asks a person, so every Issue waits for Allow once.
  guardHook:
    name: no-identifiers-in-github
    description: >-
      Blocks a GitHub Issue call whose text contains a GUID or trace id, an Azure host name or resource id, an e-mail
      address, or a resource name with its random suffix; otherwise asks a person. Fails closed.
    script: hooks/no-identifiers.py
    timeout: 30
    failMode: block                # if the script cannot run, nothing is posted

# Reference documents uploaded to the agent's knowledge base.
knowledge:
  - knowledge/requesthub-worker-runbook.md

# Which Azure Monitor alerts this agent handles, with which custom agent, and how much autonomy it has.
responsePlan:
  name: requesthub-notification-backlog
  severities: [Sev2]
  titleContains: notification backlog
  agentMode: Review                # proposals wait for an SRE Agent Administrator; never Autonomous in this demo
  maxAutomatedInvestigationAttempts: 3
  mergeEnabled: false              # every drill starts a fresh investigation thread

# Global tool policy for every conversation on this agent. Deny wins, then allow, then ask. The github section adds
# its patterns: Issue tools to ask, the other GitHub write tools to deny.
toolPolicy:
  allow:
    - RunAzCliReadCommands
    - QueryAppInsightsByAppId
    - QueryLogAnalyticsByWorkspaceId
    - SearchMemory
    - read_skill_file
    - PlotAreaChartWithCorrelation
    - PlotBarChart
  ask:
    - RunAzCliWriteCommands
  deny:
    - RunAzCliWriteCommands(az * delete *)
    - RunAzCliWriteCommands(az monitor *)   # the platform gives the agent Monitoring Contributor on the subscription
    - RunAzCliWriteCommands(az role *)
    - RunAzCliWriteCommands(az identity *)
    - RunAzCliWriteCommands(az postgres *)
    - RunAzCliWriteCommands(az network *)
    - RunAzCliWriteCommands(az keyvault *)
    - RunAzCliWriteCommands(az ad *)
    - bash(az * delete *)
    - RunKubectlWriteCommand
    - RunInTerminal                # with GitHub connected, the terminal can use gh and git with the connection's token
    - Terminal
    - RunShellCommand
    - ExecutePythonCode
    - DisconnectRepositoryFromResourceForGitHub   # disabled by default; would change the agent's GitHub connection
