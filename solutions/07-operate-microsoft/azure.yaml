# Azure Developer CLI project for the Operate · Microsoft solution. Run `azd up` from this folder.
# It provisions infra/ (RequestHub's hosting platform from app/infra, the backlog alert and workbook, and Azure SRE
# Agent) and deploys the shared app: the api and worker images are built in Azure Container Registry, and each
# `azd deploy` applies app/infra/api.bicep or worker.bicep so image and configuration ship together.
# The hooks connect the solution to GitHub Actions and apply the SRE Agent configuration in sre-agent/.
name: ai-sdlc-operate-microsoft
metadata:
  template: ai-sdlc-operate-microsoft@1.0.0
infra:
  provider: bicep
  path: infra
services:
  api:
    project: ../../app
    language: docker
    host: containerapp
    module: ../../../app/infra/api
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
  worker:
    project: ../../app
    language: docker
    host: containerapp
    module: ../../../app/infra/worker
    docker:
      path: ./Dockerfile.worker
      context: .
      remoteBuild: true
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: python configure_github.py prepare
    posix:
      shell: sh
      run: python3 configure_github.py prepare
  postprovision:
    windows:
      shell: pwsh
      run: python configure_github.py publish && python configure_sre_agent.py
    posix:
      shell: sh
      run: python3 configure_github.py publish && python3 configure_sre_agent.py
