# Local stack for machines with Docker: PostgreSQL + API (with web UI) + worker.
#   docker compose up --build      then open http://localhost:8080
# Uses the development persona switcher (Auth:Mode=Development). Never expose this stack publicly.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: requesthub
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: requesthub
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requesthub"]
      interval: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RequestHub: Host=db;Port=5432;Database=requesthub;Username=requesthub;Password=devpass
      Storage__LocalPath: /tmp/attachments
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RequestHub: Host=db;Port=5432;Database=requesthub;Username=requesthub;Password=devpass
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
