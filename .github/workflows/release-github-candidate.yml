# Release · GitHub: build a RequestHub release candidate and its evidence, then stop at a draft release for a person.
#  1. Preflight: the version is new, the run is on main, and the release-github environment exists (it decides who
#     can approve). Nothing is built when preflight fails.
#  2. Build and test the exact commit: API and worker integration tests on PostgreSQL, web UI type check and tests.
#  3. Build the API and worker container images, push them to GitHub Container Registry, and record their digests and
#     SBOMs (generated by BuildKit while building).
#  4. Deployment check: start the pushed images by digest on the runner, then run a business smoke test and the
#     Playwright browser tests against them.
#  5. Gate on every test report, then assemble the release manifest, checksums, and notes into a DRAFT release.
# Nothing here publishes. A person approves with release-github-approve.yml. Every test report is uploaded even when a
# job fails, so the workflow-investigation skill can explain the failure.
name: Release · GitHub · build the release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 1.0.0 (tagged demo-v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-github-candidate
  cancel-in-progress: false

env:
  SKILL: .github/skills/release-evidence

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # read the release-github environment's protection rules
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      previous_tag: ${{ steps.check.outputs.previous_tag }}
      image_prefix: ${{ steps.check.outputs.image_prefix }}
      approval_mode: ${{ steps.check.outputs.approval_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check the version, the branch, and the approval environment
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: python "$SKILL/release_evidence.py" preflight --version "$VERSION"

  api-tests:
    name: API and worker tests
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: requesthub
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: requesthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U requesthub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build app/RequestHub.slnx -c Release
      - name: Test (integration tests on PostgreSQL, includes the API contract check)
        run: >-
          dotnet test --solution app/RequestHub.slnx -c Release --no-build
          --results-directory evidence --report-xunit-junit --report-xunit-junit-filename api-tests.junit.xml
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-api-tests
          path: evidence/api-tests.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  web-tests:
    name: Web UI tests
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci --prefix app/web
      - run: npm run typecheck --prefix app/web
      - name: Unit tests
        working-directory: app/web
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit="$GITHUB_WORKSPACE/evidence/web-tests.junit.xml"
      - run: npm run build --prefix app/web
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-web-tests
          path: evidence/web-tests.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  images:
    name: Image (${{ matrix.service }})
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: app/Dockerfile
          - service: worker
            dockerfile: app/Dockerfile.worker
    env:
      IMAGE: ${{ needs.preflight.outputs.image_prefix }}/requesthub-${{ matrix.service }}
      TAG: ${{ needs.preflight.outputs.tag }}
      SERVICE: ${{ matrix.service }}
      DOCKERFILE: ${{ matrix.dockerfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the image, with SBOM and provenance attestations
        run: |
          docker buildx create --name release --driver docker-container --use
          docker buildx build app \
            --file "$DOCKERFILE" \
            --build-arg BUILD_SHA="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$TAG" \
            --label org.opencontainers.image.description="RequestHub $SERVICE, demo release candidate" \
            --sbom=true --provenance=mode=max \
            --tag "$IMAGE:$TAG" \
            --metadata-file metadata.json \
            --push
          echo "DIGEST=$(jq -r '."containerimage.digest"' metadata.json)" >> "$GITHUB_ENV"
      - name: Record the digest and extract the SBOM
        run: |
          mkdir -p evidence
          sbom="sbom-requesthub-$SERVICE.spdx.json"
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{ json .SBOM.SPDX }}' > "evidence/$sbom"
          jq -e '.spdxVersion' "evidence/$sbom" > /dev/null
          jq -n --arg service "$SERVICE" --arg name "$IMAGE" --arg tag "$TAG" --arg digest "$DIGEST" \
            --arg build_sha "$GITHUB_SHA" --arg sbom "$sbom" \
            '{service: $service, name: $name, tag: $tag, digest: $digest, build_sha: $build_sha, sbom: $sbom}' \
            | tee "evidence/image-$SERVICE.json"
          echo "Pushed \`$IMAGE@$DIGEST\` ($(jq '.packages | length' "evidence/$sbom") packages in the SBOM)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-image-${{ matrix.service }}
          path: evidence/
          retention-days: 7

  acceptance:
    name: Deployment check on the release images
    needs: [preflight, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # pull the images just pushed
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: requesthub
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: requesthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U requesthub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidence-image-*
          merge-multiple: true
          path: images
      - name: Start the release images by digest (development sign-in, local database)
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE: Host=localhost;Port=5432;Database=requesthub;Username=requesthub;Password=devpass
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          api=$(jq -r '.name + "@" + .digest' images/image-api.json)
          worker=$(jq -r '.name + "@" + .digest' images/image-worker.json)
          docker run -d --name requesthub-api --network host -e ASPNETCORE_ENVIRONMENT=Development \
            -e ASPNETCORE_HTTP_PORTS=8080 -e "ConnectionStrings__RequestHub=$DATABASE" -e Storage__LocalPath=/tmp/attachments "$api"
          docker run -d --name requesthub-worker --network host -e ASPNETCORE_ENVIRONMENT=Development \
            -e ASPNETCORE_HTTP_PORTS=8081 -e "ConnectionStrings__RequestHub=$DATABASE" "$worker"
          echo "Started \`$api\` and \`$worker\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test (business flow against the images)
        run: >-
          python "$SKILL/smoke_test.py" --api http://localhost:8080 --worker http://localhost:8081
          --expect-sha "$GITHUB_SHA" --junit evidence/smoke-tests.junit.xml --json evidence/smoke-results.json
      - name: Browser tests against the release API image
        working-directory: app/web
        env:
          BASE_URL: http://localhost:8080
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/evidence/browser-tests.junit.xml
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --reporter=list,junit
      - name: Container logs
        if: failure()
        run: |
          docker logs requesthub-api 2>&1 | tail -n 200 || true
          docker logs requesthub-worker 2>&1 | tail -n 100 || true
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-acceptance
          path: evidence/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Draft the release
    needs: [preflight, api-tests, web-tests, images, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # generate the notes and create the draft release
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
      APPROVAL_MODE: ${{ needs.preflight.outputs.approval_mode }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidence-*
          merge-multiple: true
          path: evidence
      - name: Gate on every test report
        run: |
          {
            echo "### Test evidence for \`$TAG\`"
            echo
            python "$SKILL/summarize_tests.py" \
              --suite api=evidence/api-tests.junit.xml --suite web=evidence/web-tests.junit.xml \
              --suite smoke=evidence/smoke-tests.junit.xml --suite browser=evidence/browser-tests.junit.xml \
              --out evidence/test-summary.json
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Generate the list of changes (GitHub release notes)
        run: |
          args=(-f tag_name="$TAG" -f target_commitish="$GITHUB_SHA")
          if [ -n "$PREVIOUS_TAG" ]; then args+=(-f previous_tag_name="$PREVIOUS_TAG"); fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > evidence/whats-changed.md
      - name: Assemble the release manifest, checksums, and notes
        run: >-
          python "$SKILL/release_evidence.py" assemble --evidence evidence --out release --notes release-notes.md
          --tag "$TAG" --commit "$GITHUB_SHA" --ref "$GITHUB_REF" --previous-tag "$PREVIOUS_TAG"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --requested-by "$GITHUB_ACTOR"
          --approval-mode "$APPROVAL_MODE"
      - name: Create the draft release (replaces an earlier draft of the same version)
        run: |
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id")
          for id in $draft; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          gh release create "$TAG" release/* --draft --target "$GITHUB_SHA" \
            --title "RequestHub $TAG (demo)" --notes-file release-notes.md
          url=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .html_url" | head -n 1)
          {
            echo "### Draft release ready for approval"
            echo
            echo "[RequestHub $TAG (draft)]($url): review it, then run **Release · GitHub · approve and publish** with tag \`$TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the evidence for the AI release summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: |
            release/
            release-notes.md
          retention-days: 7
