# Release · Microsoft: roll RequestHub's API back to the previous revision on Azure Container Apps.
# The previous revision is still running (promotion keeps it warm), so this is one atomic traffic change, then the same
# production smoke test as a release. Nothing is rebuilt or redeployed. Running it twice rolls forward again.
# Run it from the Actions tab or `gh workflow run release-microsoft-rollback.yml`. Like the rollout, it never prints what
# names your resources: those values are environment secrets, and the release record uses placeholders.
name: Release · Microsoft · roll back to the previous revision

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Revision name or suffix to roll back to (empty means the revision labelled previous)
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-microsoft
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SOLUTION: solutions/06-release-microsoft

jobs:
  rollback:
    name: Roll back and verify production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-microsoft
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      API_APP_NAME: ${{ secrets.API_APP_NAME }}
      API_IDENTIFIER_URI: ${{ secrets.API_IDENTIFIER_URI }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Roll back (one atomic traffic change) and verify production
        env:
          REVISION: ${{ inputs.revision }}
        run: python "$SOLUTION/release.py" rollback ${REVISION:+--to "$REVISION"}
      - name: Release record
        if: always()
        run: python "$SOLUTION/release.py" record
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-record
          path: ${{ env.SOLUTION }}/out/release/
