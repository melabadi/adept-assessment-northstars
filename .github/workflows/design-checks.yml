# Design phase gates: ADR completeness and API contract compatibility. Deterministic; reviewers and Copilot code review
# comment on the content, these checks decide whether the PR is mergeable.
name: Design · checks

on:
  pull_request:
    paths: ['docs/adr/**', 'app/contracts/**', 'phases/02-design/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adr:
    name: ADR checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check ADRs changed in this PR
        run: |
          set +e
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          mapfile -t adrs < <(git diff --name-only --diff-filter=AM "$base" HEAD -- 'docs/adr/*.md' 'docs/adr/**/*.md')
          if [ ${#adrs[@]} -eq 0 ]; then echo "No ADR changes."; exit 0; fi
          python .github/skills/architecture-decision/check_adr.py "${adrs[@]}" | tee adr.txt
          status=${PIPESTATUS[0]}
          { echo "### ADR checks"; echo '```'; cat adr.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  contract:
    name: API contract compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Compare app/contracts/openapi.json with the base branch
        run: |
          set +e
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          python .github/skills/contract-impact/contract_diff.py --base-ref "$base" --markdown impact.md --fail-on-breaking
          status=$?
          cat impact.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
