# Design · Microsoft: keep the standards index in sync with the repository and measure the advisor on its ten labelled
# cases. Runs on demand, and whenever a change to the standards, the agent definition, the advisor, or the evaluation
# reaches main, so every change is measured. Signs in to Azure with OIDC (GitHub environment design-microsoft, no stored
# secret); every result comes from live Foundry and Azure AI Search calls. The endpoints are environment secrets, and the
# first step masks the host and resource names derived from them, so the logs never show them.
name: Design · Microsoft · sync the standards and evaluate the advisor

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Runs per case (3 measures run-to-run stability)
        type: choice
        options: ['1', '3']
        default: '1'
      cases:
        description: Case ids to run, for example E07,E08 (empty runs all ten)
        required: false
  push:
    branches: [main]
    paths:
      - solutions/02-design-microsoft/standards/**
      - solutions/02-design-microsoft/agent.yaml
      - solutions/02-design-microsoft/advisor.py
      - solutions/02-design-microsoft/ingest_standards.py
      - solutions/02-design-microsoft/eval_advisor.py
      - solutions/02-design-microsoft/eval_cases.jsonl

permissions:
  contents: read
  id-token: write

concurrency:
  group: design-microsoft-eval
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  evaluate:
    name: Sync the standards, then evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: design-microsoft
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_MODEL_DEPLOYMENT: ${{ vars.FOUNDRY_MODEL_DEPLOYMENT }}
      SEARCH_ENDPOINT: ${{ secrets.SEARCH_ENDPOINT }}
      SEARCH_CONNECTION_NAME: ${{ vars.SEARCH_CONNECTION_NAME }}
    steps:
      - name: Mask the deployed resource names
        run: |
          # GitHub masks the secrets themselves; an error message could still print a host or resource name alone.
          for url in "$FOUNDRY_PROJECT_ENDPOINT" "$SEARCH_ENDPOINT"; do
            host="${url#https://}"; host="${host%%/*}"; name="${host%%.*}"
            for value in "$host" "$name" "${name#*-}"; do
              if [ -n "$value" ]; then echo "::add-mask::$value"; fi
            done
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r solutions/02-design-microsoft/requirements.txt
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sync the standards index with this commit (idempotent)
        run: python solutions/02-design-microsoft/ingest_standards.py | tee ingest.txt
      - name: Evaluate the advisor on the labelled cases (live)
        env:
          REPEAT: ${{ inputs.repeat || '1' }}
          CASES: ${{ inputs.cases }}
        run: |
          args=(--repeat "$REPEAT" --out out/eval)
          if [ -n "$CASES" ]; then args+=(--cases "$CASES"); fi
          set +e
          python solutions/02-design-microsoft/eval_advisor.py "${args[@]}"
          status=$?
          set -e
          {
            echo "### Standards index"
            echo
            echo '```'
            cat ingest.txt
            echo '```'
            echo
            if [ -f out/eval/results.md ]; then cat out/eval/results.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Keep the results (every run with its response id)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: design-advisor-eval-${{ github.run_id }}
          path: out/eval/
          if-no-files-found: ignore
