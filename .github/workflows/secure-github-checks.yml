name: Secure · GitHub · lab tooling checks

on:
  pull_request:
    paths:
      - solutions/05-secure-github/**
      - .github/agents/secure-github.agent.md
      - .github/skills/finding-triage/**
      - .github/skills/verified-remediation/**
      - .github/workflows/secure-github-*.yml
      - .github/ISSUE_TEMPLATE/05-secure-github-*.yml
  push:
    branches: [main]
    paths: ['solutions/05-secure-github/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/sync_solutions.py --check
      - run: python -m unittest discover -s solutions/05-secure-github/tests -v
      - name: Confirm the unsafe patch still applies without changing the app
        run: git apply --check solutions/05-secure-github/lab/code-finding.patch
