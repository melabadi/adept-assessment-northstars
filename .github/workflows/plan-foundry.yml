# Plan phase, Microsoft track: run the Microsoft Foundry requirements analyst from GitHub (OIDC, no secrets in code),
# then open a PR with its brief so the same human review -> `brief-approved` -> publish flow applies.
name: Plan · Foundry requirements analyst

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run the Foundry agent (live call)
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL_DEPLOYMENT: ${{ vars.FOUNDRY_MODEL_DEPLOYMENT }}
        run: python phases/01-plan/microsoft/requirements_analyst.py
      - name: Open a review PR with the Foundry brief
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          branch="plan/foundry-brief-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add phases/01-plan/output/microsoft
          git commit -m "Plan: Foundry requirements brief (run $RUN_ID)"
          git push origin "$branch"
          response=$(jq -r .responseId phases/01-plan/output/microsoft/run.json)
          agent=$(jq -r '"\(.agent.name) v\(.agent.version)"' phases/01-plan/output/microsoft/run.json)
          gh pr create --head "$branch" --title "Plan: Foundry requirements brief" --body "$(cat <<EOF
          Produced by the Microsoft Foundry agent **$agent** (response \`$response\`) from \`phases/01-plan/inputs\`.

          Review \`phases/01-plan/output/microsoft/brief.md\`. When it is right, apply the **brief-approved** label to publish the epic and tasks.
          EOF
          )"
