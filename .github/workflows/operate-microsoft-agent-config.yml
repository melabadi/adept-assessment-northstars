# Operate · Microsoft: Azure SRE Agent's behavior is code, reviewed like code.
#  - Pull request: checks sre-agent/ against the solution's rules (Review mode, approval before any Azure write, deletes
#    denied, known skills and placeholders) without touching Azure.
#  - Push to main, or a manual run on main: applies the custom agent, skills, runbook, and response plan to the live
#    agent through OIDC, then reads them back. The GitHub environment only accepts main. The workflow's identity cannot
#    approve the agent's actions, and the global tool policy stays with an SRE Agent Administrator
#    (`python configure_sre_agent.py` on their machine).
name: Operate · Microsoft · apply the SRE Agent configuration

on:
  pull_request:
    paths:
      - 'solutions/07-operate-microsoft/sre-agent/**'
      - 'solutions/07-operate-microsoft/configure_sre_agent.py'
      - '.github/workflows/operate-microsoft-agent-config.yml'
  push:
    branches: [main]
    paths:
      - 'solutions/07-operate-microsoft/sre-agent/**'
      - 'solutions/07-operate-microsoft/configure_sre_agent.py'
      - '.github/workflows/operate-microsoft-agent-config.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operate-microsoft-agent-config-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check the agent configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r solutions/07-operate-microsoft/requirements.txt
      - run: python solutions/07-operate-microsoft/configure_sre_agent.py --check

  apply:
    name: Apply it to the live agent
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: operate-microsoft
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      SRE_AGENT_NAME: ${{ vars.SRE_AGENT_NAME }}
      WORKER_APP_NAME: ${{ vars.WORKER_APP_NAME }}
      API_APP_NAME: ${{ vars.API_APP_NAME }}
      APPLICATIONINSIGHTS_NAME: ${{ vars.APPLICATIONINSIGHTS_NAME }}
      LOG_ANALYTICS_NAME: ${{ vars.LOG_ANALYTICS_NAME }}
      BACKLOG_ALERT_NAME: ${{ vars.BACKLOG_ALERT_NAME }}
      BACKLOG_ALERT_THRESHOLD_SECONDS: ${{ vars.BACKLOG_ALERT_THRESHOLD_SECONDS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r solutions/07-operate-microsoft/requirements.txt
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Apply and read back
        run: python solutions/07-operate-microsoft/configure_sre_agent.py --skip-tool-policy | tee apply.log
      - name: Report
        if: always()
        run: |
          if [ -f apply.log ]; then { echo '```'; cat apply.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
