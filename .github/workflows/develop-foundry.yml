# Develop phase, Microsoft track: publish the Foundry triage agent when its definition changes, then evaluate the live
# agent through the real RequestHub API on 12 labelled cases. A failing case opens (or updates) an engineering Issue and a
# case that passes again closes it. Routing policies are data the agent reads through a tool, so a rule change is
# re-evaluated here without retraining anything.
name: Develop · Foundry triage evaluation

on:
  push:
    branches: [main]
    paths:
      - 'phases/03-develop/microsoft/**'
      - 'app/src/RequestHub.Core/Profiles/**'
      - 'app/src/RequestHub.Core/Triage/**'
      - 'app/src/RequestHub.Api/Triage/**'
      - '.github/workflows/develop-foundry.yml'
  workflow_dispatch:
    inputs:
      repeat:
        description: Runs per case (2 or more measures repeatability)
        default: '1'
      cases:
        description: Comma-separated case ids, for example T06,T08 (empty runs all 12)
        default: ''

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: develop-foundry
  cancel-in-progress: false

jobs:
  evaluate:
    name: Publish agent and evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure-demo
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: requesthub
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: requesthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U requesthub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check the agent's tool contract (declared = executed, read-only, strict schemas)
        run: python .github/skills/foundry-tools/check_tools.py
      - name: Build the API
        run: dotnet build app/src/RequestHub.Api -c Release
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish the agent (a new version only when triage-agent.yaml changed)
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL_DEPLOYMENT: ${{ vars.FOUNDRY_MODEL_DEPLOYMENT }}
        run: python phases/03-develop/microsoft/publish_triage_agent.py
      - name: Start RequestHub with the Foundry triage provider
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5090
          Triage__Provider: Foundry
          Foundry__ProjectEndpoint: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
        run: |
          nohup dotnet run --project app/src/RequestHub.Api -c Release --no-build --no-launch-profile > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5090/health/ready > /dev/null; then echo "API ready"; exit 0; fi
            sleep 2
          done
          cat api.log; exit 1
      - name: Evaluate the live agent (deterministic checks, Issues for failing cases)
        env:
          GH_TOKEN: ${{ github.token }}
          REPEAT: ${{ inputs.repeat || '1' }}
          CASES: ${{ inputs.cases }}
        run: |
          args=(--repeat "$REPEAT" --issues)
          if [ -n "$CASES" ]; then args+=(--cases "$CASES"); fi
          python phases/03-develop/microsoft/eval_triage.py "${args[@]}"
      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-eval
          path: |
            phases/03-develop/output/microsoft/eval
            api.log
          retention-days: 14
