# Develop · GitHub: a feature pull request must stay inside its bounds, whoever wrote it (Copilot or a person).
# It runs on pull requests that change the app and close an Issue labeled `phase:develop`, the feature Issues this
# solution hands to Copilot. The checker comes from the base branch and the pull request only supplies the commits it
# inspects, so a pull request cannot change the rules it is judged by. The check fails when the change leaves app/
# (CI/CD, agent configuration, infrastructure), edits an existing migration, touches approval authority, deletes or skips
# a test, changes code without tests, or breaks the API contract. The app's own tests run in the CI workflow.
name: Develop · GitHub · feature bounds

on:
  pull_request:
    paths: ['app/**']

permissions:
  contents: read

concurrency:
  group: develop-github-bounds-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  feature:
    name: Find the feature Issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      issues: ${{ steps.linked.outputs.issues }}
    steps:
      - name: Issues labeled phase:develop that this pull request closes
        id: linked
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          issues=$(gh api graphql -f owner="$OWNER" -f name="$NAME" -F pr="$PR" -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  closingIssuesReferences(first: 10) { nodes { number labels(first: 50) { nodes { name } } } }
                }
              }
            }' --jq '[.data.repository.pullRequest.closingIssuesReferences.nodes[]
                      | select(any(.labels.nodes[]; .name == "phase:develop")) | "#\(.number)"] | join(" ")')
          echo "issues=$issues" >> "$GITHUB_OUTPUT"
          if [ -n "$issues" ]; then
            echo "Feature pull request for $issues: checking its bounds." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No linked Issue labeled phase:develop, so this is not a feature pull request. Bounds check skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  bounds:
    name: Feature stays within its bounds
    needs: feature
    if: needs.feature.outputs.issues != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the trusted checker (base branch, full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Fetch the pull request's commits (read as data, never run)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"
      - name: Check scope, migrations, approval authority, tests, and contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ISSUES: ${{ needs.feature.outputs.issues }}
        run: |
          set +e
          python .github/skills/bounded-feature/scope_check.py --base "$BASE_SHA" --head "$HEAD_SHA" > bounds.txt 2>&1
          status=$?
          cat bounds.txt
          {
            echo "### Feature bounds for $ISSUES"
            echo
            echo '```'
            cat bounds.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
