# Design · Microsoft: deterministic checks on every pull request that changes this solution. No Azure access and no
# secrets: the standards must parse into index documents, the evaluation labels must agree with what each profile may
# retrieve, and the advisor's gates must reject invented, out-of-scope, misversioned, or misquoted citations.
# The live evaluation runs after merge (design-microsoft-eval.yml), so unreviewed standards never reach the index.
name: Design · Microsoft · check the standards and the advisor gates

on:
  pull_request:
    paths: ['solutions/02-design-microsoft/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Standards, evaluation labels, and gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r solutions/02-design-microsoft/requirements.txt
      - name: Parse the standards into index documents (dry run)
        run: python solutions/02-design-microsoft/ingest_standards.py --dry-run
      - name: Offline tests (fixtures only, no Azure)
        run: python -m unittest discover -s solutions/02-design-microsoft -p "test_*.py" -v
