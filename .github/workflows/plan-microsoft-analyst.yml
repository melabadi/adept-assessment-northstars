# Plan · Microsoft: run the Microsoft Foundry requirements analyst from GitHub Actions (OIDC, no stored secrets), then
# open a pull request with its brief so the same review gate applies: a person reviews it and applies `brief-approved`
# to publish the backlog (plan-microsoft-brief.yml).
name: Plan · Microsoft · run the Foundry requirements analyst

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: plan-microsoft-analyst
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Run the agent and open a review pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: plan-microsoft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r solutions/01-plan-microsoft/requirements.txt
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run the Foundry agent (live call, validated, one repair turn)
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL_DEPLOYMENT: ${{ vars.FOUNDRY_MODEL_DEPLOYMENT }}
        run: python solutions/01-plan-microsoft/requirements_analyst.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open a review pull request with the Foundry brief
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          BRIEF: solutions/01-plan-microsoft/brief
        run: |
          branch="plan/foundry-brief-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$BRIEF"
          git commit -m "Plan: Foundry requirements brief (run $RUN_ID)"
          git push origin "$branch"
          agent=$(jq -r '"\(.agent.name) v\(.agent.version)"' "$BRIEF/run.json")
          response=$(jq -r .responseId "$BRIEF/run.json")
          validation=$(python .github/skills/requirements-traceability/validate_backlog.py --backlog "$BRIEF/backlog.json" || true)
          gh pr create --head "$branch" --title "Plan: Foundry requirements brief" --body "$(cat <<EOF
          Produced by the Microsoft Foundry agent **$agent** (response \`$response\`) from \`solutions/01-plan-microsoft/inputs\`, in [workflow run $RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID).

          Validation: \`$validation\`

          Review \`$BRIEF/brief.md\`. When it is right, apply the **brief-approved** label to publish the epic and tasks as Issues.
          EOF
          )"
