name: "Design: architecture decision with Copilot"
description: Design phase (GitHub track). Copilot drafts an ADR from the reviewed brief, standards, and real code for human design review.
title: "Design: how should RequestHub add a live AI triage provider?"
labels: ["ai-sdlc", "phase:design"]
body:
  - type: markdown
    attributes:
      value: |
        After you create this issue, **assign it to Copilot** and pick the **design-github** custom agent.
        Copilot opens a PR with an ADR in `docs/adr/`. The `Design · checks` workflow validates it; request a **Copilot code review**
        on the PR, then a person accepts or rejects the decision.
  - type: textarea
    id: question
    attributes:
      label: Design question
      value: How should RequestHub add a live AI triage provider while preserving access control, human approval, observability, and a low-complexity deployment?
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs
      value: |
        - Brief: phases/02-design/inputs/reviewed-brief.md
        - Standards: phases/02-design/standards/
        - Code: app/src/RequestHub.Core/Triage/ITriageProvider.cs, app/contracts/openapi.json, infra/core.bicep
    validations:
      required: true
