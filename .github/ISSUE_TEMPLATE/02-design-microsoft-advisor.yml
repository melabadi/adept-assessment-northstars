name: "Design: ask the Foundry architecture advisor"
description: Design phase (Microsoft track). An Azure Function asks a Microsoft Foundry agent grounded in the approved architecture standards, checks its citations, and drafts an ADR for review.
title: "Architecture question: "
labels: ["ai-sdlc", "phase:design", "design-advisor"]
body:
  - type: markdown
    attributes:
      value: |
        Opening this issue sends your question to Azure when you are this repository's owner, a member, or a collaborator; the advisor ignores Issues from anyone else. An Azure Function asks the architecture advisor in Microsoft Foundry, which answers only from the approved standards the selected operating profile may retrieve, and says so when they do not answer the question.
        The Function checks every citation against the standards index before anything is posted. The advisor then comments here and opens a pull request with a draft ADR that an architect accepts (merge) or rejects (close). Its answer is advisory.
  - type: dropdown
    id: profile
    attributes:
      label: Operating profile
      description: Decides which standards the advisor can retrieve.
      options:
        - enterprise
        - small-team
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: One design question. Add the context the standards cannot know, such as what you already decided.
      placeholder: Should the live AI triage provider run inside the existing API or as a separate service?
    validations:
      required: true
